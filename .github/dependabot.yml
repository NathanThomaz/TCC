version: 2
# Atualizações automáticas e sem trabalho manual (DEC-AMB-037):
# - um PR agrupado por ecossistema, uma vez por mês (menos execuções de CI);
# - versões "major" vêm em PR separado e só entram se os testes passarem (DEC-AMB-040);
# - o workflow dependabot-automerge.yml faz o merge sozinho quando o check "check" passa.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencias-npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      acoes-github:
        patterns: ["*"]
        update-types: [minor, patch]
