name: Dependabot auto-merge

# Liga o auto-merge nos PRs do Dependabot. O merge só acontece depois que a proteção
# da main for satisfeita (teste "pytest" verde); se o teste falhar, o PR fica aberto.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Ler dados da atualização
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Ativar auto-merge (exceto major de bibliotecas Python)
        if: steps.meta.outputs.update-type != 'version-update:semver-major' || steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
